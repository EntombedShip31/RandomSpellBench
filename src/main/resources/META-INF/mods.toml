modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="随机法术测试台"
authors="${mod_authors}"
logoFile="icon.png"
logoBlur=false
description='''
§b§l随机法术测试台 §8v${mod_version}
§7Iron's Spells 'n Spellbooks（铁魔法）附属模组 —— 面向创造模式的法术测试台。

§a■ §e法术池§7：中文/拼音搜索、施法类型过滤（全部/即时/持续/长吟）、图标与悬浮详情、全选与清除
§a■ §e分配规则§7：按权重随机抽取，可设数量，并支持「每学派至少 1 个」
§a■ §e等级规则§7：范围内随机，或固定等级以对比同一法术的不同强度
§a■ §e法术书§7：随机取自铁魔法法术书、以你的名字命名，并自动装备到 Curios 法术书槽
§a■ §e选中法术§7：生成法术卷轴、长按永久学习、点击思索预览（需 iss_ponder）、复现上次结果
§a■ §e一键拆解§7：按 V 键 / §e/rsta extract§7，把法术书里的法术一次抄成卷轴放进背包
§a■ §e分配后§7：回满血量与饥饿、清除状态效果与铁魔法冷却，结果以 actionbar 一行播报
§a■ §e指令§7：/rsta help 查看全部；config / randomize / undo / chat / extract / scroll / learn / unlock / lock / reload
§a■ §e权限§7：默认仅创造模式可用，/rsta unlock 解除（op 2 可批量）

§6按 F6 键（未安装铁魔法时为 K），或输入 §e/rsta config §6打开测试台
§6按 V 键，或输入 §e/rsta extract §6一键拆下法术书里的卷轴
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=true
    # 需要 3.15.0+（该版本起 1.20.1 分支采用 Mutable/Immutable 法术容器 API）
    versionRange="[1.20.1-3.15.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.4.7,)"
    ordering="AFTER"
    side="BOTH"
