# Gradle JVM 内存
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47.4.0,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 模组信息
mod_id=randomspellbench
# 注意：gradle.properties 由 Gradle 以 ISO-8859-1 读取，这里只放 ASCII。
# 中文的模组名与简介直接写在 src/main/resources/META-INF/mods.toml 里（UTF-8 资源文件），
# jar 文件名则在 build.gradle 中用 Unicode 转义设置。
mod_name=Random Spell Test Bench
mod_version=1.0.4
mod_group_id=com.randomspellbench
mod_authors=RandomSpellBench Team
mod_license=MIT
mod_issue_tracker=https://github.com/EntombedShip31/RandomSpellBench/issues

# 核心依赖
# 注意：1.20.1 版 ISS 的 mods.toml 并未声明 irons_lib 依赖（它是 1.21+ 才引入的前置），因此这里不写 irons_lib。
# 说明：code.redspace.io maven 上 1.20.1 版本从 3.15.0 开始发布（旧 3.4.x 仅发布在 CurseForge/Modrinth），
# 这里使用 maven 上的最新 1.20.1 版本 3.16.3（其法术容器已采用 Mutable/Immutable API）。
irons_spells_version=1.20.1-3.16.3
curios_version=5.4.7+1.20.1
geckolib_version=1.20.1:4.7.1.1
player_animator_version=1.0.2-rc1+1.20
caelus_version=3.1.0+1.20
